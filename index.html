<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Gemini API on GitHub Pages</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
        textarea { width: 100%; height: 100px; }
        #result { white-space: pre-wrap; background: #f4f4f4; padding: 15px; margin-top: 20px; }
    </style>
</head>
<body>

    <h1>Gemini API テスト</h1>
    
    <label>API キー:</label><br>
    <input type="password" id="apiKey" placeholder="AI StudioのAPIキーを入力" style="width: 100%; margin-bottom: 10px;"><br>

    <label>プロンプト:</label><br>
    <textarea id="prompt">こんにちは！自己紹介をしてください。</textarea><br>
    
    <button onclick="generateText()">送信する</button>

    <h3>結果:</h3>
    <div id="result">ここに結果が表示されます</div>

    <script type="importmap">
      {
        "imports": {
          "@google/genai": "https://esm.run/@google/genai"
        }
      }
    </script>

    <script type="module">
        import { GoogleGenAI } from "@google/genai";

        window.generateText = async function() {
            const apiKey = document.getElementById('apiKey').value;
            const prompt = document.getElementById('prompt').value;
            const resultDiv = document.getElementById('result');

            if (!apiKey) {
                alert('APIキーを入力してください');
                return;
            }

            resultDiv.textContent = '生成中...';

            try {
                const ai = new GoogleGenAI({ apiKey: apiKey });
                const response = await ai.models.generateContent({
                    model: 'gemini-3.8-flash',
                    contents: prompt,
                });

                resultDiv.textContent = response.text;
            } catch (error) {
                console.error(error);
                resultDiv.textContent = 'エラーが発生しました: ' + error.message;
            }
        };
    </script>
</body>
</html>
